{% extends 'base.html' %}

{% block title %}Chỉnh Sửa Hồ Sơ | CodeJourney{% endblock %}

{% block link %}
    <style>
        body {
            background-color: #1e1e2f;
        }
        .custom-file-upload input[type="file"] {
            display: none;
        }
        .frame-item.selected {
            box-shadow: 0 0 0 3px #6366f1;
        }
        .frame-image {
            transition: all 0.2s ease;
        }
        .frame-item:hover .frame-image {
            transform: scale(1.05);
        }
        textarea {
            resize: none;
        }
        .avatar-preview {
            position: relative;
            width: 128px;
            height: 128px;
            margin: 0 auto;
        }
        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #6366f1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            text-align: center;
            margin-top: 0.5rem;
        }
        .profile-card {
            background: linear-gradient(145deg, #27293d, #1f2031);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a3b4d;
        }
        .input-field {
            background-color: #2a2b3d;
            border-color: #3a3b4d;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }
    </style>
{% endblock %}

{% block content %}
<div class=" mx-auto px-4 py-8 max-w-5xl">
        <div class="profile-card rounded-xl p-6 md:p-8">
            <h2 class="text-2xl md:text-3xl font-bold mb-6 text-center text-indigo-300">
                <i class="fas fa-user-edit mr-2"></i>Chỉnh Sửa Hồ Sơ
            </h2>
            
            <form id="profile-form" method="POST" enctype="multipart/form-data" class="space-y-6">
                <!-- Avatar Section -->
                <div class="flex flex-col items-center space-y-4">
                    <div class="avatar-preview group relative">
                        <img id="avatar-preview"
                             src="{{ user.avatar if user.avatar else url_for('static', filename='images/2.jpg') }}"
                             alt="Avatar"
                             class="rounded-full p-0.5 w-full h-full object-cover">
                        <div class="absolute inset-0 rounded-full bg-black bg-opacity-50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            <i class="fas fa-camera text-white text-2xl"></i>
                        </div>
                    </div>
                    
                    <div class="file-upload-wrapper">
                        <label class="custom-file-upload bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg cursor-pointer transition-colors duration-300 inline-flex items-center">
                            <i class="fas fa-cloud-upload-alt mr-2"></i>Tải Ảnh
                            <input type="file" name="avatar" id="avatar-input" accept="image/*">
                        </label>
                    </div>
                    <div id="avatar-error" class="error-message hidden"></div>
                </div>

                <!-- Slogan Section -->
                <div class="space-y-2">
                    <label for="slogan" class="block text-sm font-medium text-gray-300">
                        <i class="fas fa-quote-left mr-2"></i>Slogan:
                    </label>
                    <textarea id="slogan" name="slogan" rows="3"
                           class="w-full px-4 py-2 input-field border rounded-lg focus:ring-2 focus:ring-indigo-500 text-white placeholder-gray-400 transition-all"
                           placeholder="Hãy viết slogan thật đặc biệt...">{{ user.slogan if user.slogan else '' }}</textarea>
                </div>

                <!-- Frame Selection Section -->
                <div class="space-y-4">
                    <label class="block text-sm font-medium text-gray-300">
                        <i class="fas fa-image mr-2"></i>Chọn Khung Viền:
                    </label>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        {% for frame in frames %}
                        <div class="frame-item p-2 rounded-lg bg-[#2a2b3d] cursor-pointer transition-all hover:bg-[#3a3b4d] {{ 'selected' if user.selected_frame == frame.id else '' }}"
                             onclick="selectFrame({{ frame.id }})" id="frame_{{ frame.id }}">
                            <img src="{{ url_for('static', filename='uploads/frames/' + frame.image) }}"
                                  alt="Frame"
                                  class="frame-image w-full h-20 object-contain rounded">
                            <p class="frame-name text-xs text-center mt-1 text-gray-300">{{ frame.name }}</p>
                        </div>
                        {% endfor %}
                    </div>
                    
                    <!-- Default Frame Button -->
                    <div class="pt-2">
                        <button type="button" id="default-frame-btn" onclick="selectDefaultFrame()"
                                class="text-sm bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition-colors duration-300">
                            <i class="fas fa-undo mr-1"></i>Chọn khung mặc định
                        </button>
                    </div>
                    
                    <input type="hidden" id="selected-frame" name="selected_frame" value="{{ user.selected_frame if user.selected_frame else '' }}">
                </div>

                <!-- Save Button -->
                <div class="pt-4 flex gap-2">
                    <button type="button" onclick="cancelEdit()"
                            class="flex-1 bg-gray-600 hover:bg-gray-500 text-white font-medium py-3 px-4 rounded-lg shadow-md transition-all duration-300 hover:shadow-lg flex items-center justify-center">
                        <i class="fas fa-times mr-2"></i>Hủy
                    </button>
                    <button type="submit"
                             class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg shadow-md transition-all duration-300 hover:shadow-lg flex items-center justify-center">
                        <i class="fas fa-save mr-2"></i>Lưu Thay Đổi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Avatar Preview
        const avatarInput = document.getElementById('avatar-input');
        const avatarPreview = document.getElementById('avatar-preview');
        const avatarError = document.getElementById('avatar-error');

        avatarInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate file type
            if (!file.type.startsWith('image/')) {
                avatarError.textContent = 'Vui lòng chọn file ảnh (jpg, png, gif, ...)!';
                avatarError.classList.remove('hidden');
                avatarInput.value = '';
                return;
            }

            // Validate file size (e.g., max 5MB)
            if (file.size > 5 * 1024 * 1024) {
                avatarError.textContent = 'Ảnh quá lớn! Vui lòng chọn ảnh dưới 5MB.';
                avatarError.classList.remove('hidden');
                avatarInput.value = '';
                return;
            }

            // Clear error message
            avatarError.textContent = '';
            avatarError.classList.add('hidden');

            // Update preview
            const reader = new FileReader();
            reader.onload = function(e) {
                avatarPreview.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Frame Selection
        function selectFrame(frameId) {
            document.getElementById('selected-frame').value = frameId;
            document.querySelectorAll('.frame-item').forEach(item => {
                item.classList.remove('selected');
            });
            const selectedFrame = document.getElementById(`frame_${frameId}`);
            selectedFrame.classList.add('selected');
            selectedFrame.classList.add('animate-pulse');
            setTimeout(() => {
                selectedFrame.classList.remove('animate-pulse');
            }, 500);
        }

        function selectDefaultFrame() {
            document.getElementById('selected-frame').value = '';
            document.querySelectorAll('.frame-item').forEach(item => {
                item.classList.remove('selected');
            });
            const button = document.getElementById('default-frame-btn');
            button.innerHTML = '<i class="fas fa-check mr-1"></i>Đã chọn mặc định';
            setTimeout(() => {
                button.innerHTML = '<i class="fas fa-undo mr-1"></i>Chọn khung mặc định';
            }, 2000);
        }

        function cancelEdit() {
            window.location.href = "/profile";
        }

        // Form Submission Validation
        document.getElementById('profile-form').addEventListener('submit', function(event) {
            const slogan = document.getElementById('slogan').value.trim();
            if (slogan.length > 100) {
                event.preventDefault();
                alert('Slogan không được vượt quá 100 ký tự!');
            }
        });
    </script>
{% endblock %}
