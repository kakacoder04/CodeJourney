{% extends 'base.html' %}

{% block title %}Chỉnh Sửa Vật Phẩm | CodeJourney{% endblock %}

{% block link %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e1e2f',
                        secondary: '#2a2a3f',
                        accent: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #2d2d42 0%, #1e1e2f 100%);
        }
        .input-focus:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }
        .current-image {
            max-height: 150px;
            border-radius: 8px;
            border: 2px solid #3f3f5a;
        }
        /* Ẩn mũi tên tăng/giảm số */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox */
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
{% endblock %}

{% block content %}
<div class=" mx-auto px-4 py-8 max-w-6xl gradient-bg text-gray-200 min-h-screen" style="border-radius: 3%;">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div class="flex items-center">
            <i class="fas fa-box-open text-indigo-400 text-2xl mr-3"></i>
            <h1 class="text-2xl font-bold text-indigo-100">Chỉnh Sửa Vật Phẩm</h1>
        </div>
        <a href="{{ url_for('add_store_item') }}" class="flex items-center space-x-3">
            <div class="w-3 h-8 rounded-full bg-purple-500"></div>
            <div class="w-3 h-8 rounded-full bg-blue-500 opacity-70"></div>
            <div class="w-3 h-8 rounded-full bg-indigo-500 opacity-50"></div>
        </a>
    </div>

    <!-- Form Container -->
    <div class="bg-secondary rounded-xl shadow-lg overflow-hidden">
        <div class="p-6">
            {% if item %}
            <form method="POST" action="{{ url_for('edit_store_item', id=item.id) }}" enctype="multipart/form-data" class="space-y-6">
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-indigo-100 mb-2">
                        <i class="fas fa-tag mr-2 text-indigo-300"></i>Tên vật phẩm
                    </label>
                    <input type="text" id="name" name="name" value="{{ item.name | safe }}" required autocomplete="on"
                        class="w-full px-4 py-2 bg-[#3f3f5a] border border-[#4a4a6a] rounded-lg focus:outline-none input-focus text-white">
                </div>

                <!-- Price Field -->
                <div>
                    <label for="price" class="block text-sm font-medium text-indigo-100 mb-2">
                        <i class="fas fa-coins mr-2 text-yellow-400"></i>Giá (điểm)
                    </label>
                    <input type="number" id="price" name="price" value="{{ item.price }}" min="0" required autocomplete="on"
                        class="w-full px-4 py-2 bg-[#3f3f5a] border border-[#4a4a6a] rounded-lg focus:outline-none input-focus text-white ">
                </div>

                <!-- Description Field -->
                <div>
                    <label for="description" class="block text-sm font-medium text-indigo-100 mb-2">
                        <i class="fas fa-align-left mr-2 text-indigo-300"></i>Mô tả vật phẩm
                    </label>
                    <textarea id="description" name="description" rows="4" required
                        class="w-full px-4 py-2 bg-[#3f3f5a] border border-[#4a4a6a] rounded-lg focus:outline-none input-focus text-white">{{ item.description | safe }}</textarea>
                </div>

                <!-- Current Image -->
                <div>
                    <label class="block text-sm font-medium text-indigo-100 mb-2">
                        <i class="fas fa-image mr-2 text-indigo-300"></i>Hình ảnh hiện tại
                    </label>
                    <div class="flex justify-center"> <!-- Thêm `justify-center` để căn giữa theo chiều ngang -->
                        <img 
                            src="{% if item.category == 'icon' %}
                                    {{ url_for('static', filename='uploads/set_icon/' + item.image) }}
                                {% elif item.category == 'frame' %}
                                    {{ url_for('static', filename='uploads/frames/' + item.image) }}
                                {% endif %}" 
                            alt="{{ item.name | safe }}" 
                            class="current-image"
                        >
                    </div>
                </div>

                <!-- New Image Upload -->
                <div>
                    <label for="image" class="block text-sm font-medium text-indigo-100 mb-2">
                        <i class="fas fa-upload mr-2 text-indigo-300"></i>Tải ảnh mới (nếu muốn)
                    </label>
                    <div class="flex items-center space-x-4">
                        <label class="flex flex-col items-center justify-center w-full h-64 border-2 border-dashed border-[#4a4a6a] rounded-lg cursor-pointer bg-[#3f3f5a] hover:bg-[#4a4a6a] transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <i class="fas fa-cloud-upload-alt text-2xl text-indigo-300 mb-2"></i>
                                <p class="text-sm text-gray-400">Kéo thả ảnh vào đây hoặc click để chọn</p>
                            </div>
                            <input id="image" name="image" type="file" class="hidden" accept="image/*">
                        </label>
                    </div>
                </div>

                <!-- Category Select -->
                <div>
                    <label for="category" class="block text-sm font-medium text-indigo-100 mb-2">
                        <i class="fas fa-list-alt mr-2 text-indigo-300"></i>Loại vật phẩm
                    </label>
                    <select id="category" name="category" required
                        class="w-full px-4 py-2 bg-[#3f3f5a] border border-[#4a4a6a] rounded-lg focus:outline-none input-focus text-white appearance-none">
                        <option value="icon" {% if item.category == 'icon' %}selected{% endif %}>Biểu tượng</option>
                        <option value="frame" {% if item.category == 'frame' %}selected{% endif %}>Khung viền</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors flex items-center justify-center">
                        <i class="fas fa-save mr-2"></i> Lưu Thay Đổi
                    </button>
                </div>
            </form>
            {% else %}
            <div class="text-center text-gray-400">
                <p>Không tìm thấy vật phẩm!</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Image preview
        const imageInput = document.getElementById('image');
        if (imageInput) {
            imageInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const preview = document.createElement('img');
                        preview.src = event.target.result;
                        preview.className = 'current-image max-height-150px rounded-8px border-2px-solid-#3f3f5a';
                        const uploadArea = imageInput.parentElement.querySelector('div');
                        uploadArea.innerHTML = '';
                        uploadArea.appendChild(preview);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    });
</script>
{% endblock %}
