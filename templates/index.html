<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | CodeJourney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .glowing-circle {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .glowing-circle span {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(#f00, #0ff);
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }
        .glowing-circle span:nth-child(1) {
            filter: blur(10px);
        }
        .glowing-circle .image {
            position: relative;
            width: 380px; /* Khớp với kích thước của glowing-circle */
            height: 380px; /* Khớp với kích thước của glowing-circle */
            border-radius: 50%;
            z-index: 1;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e2f;
        }
        .glowing-circle .image img {
            width: 115%;
            height: 115%;
            object-fit: cover; /* Đảm bảo ảnh lấp đầy hình tròn */
        }
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        /* Ẩn hình tròn khi chiều rộng < 1000px */
        @media (max-width: 1000px) {
            .glowing-circle {
                display: none;
            }
        }
        .social-icon {
            transition: all 0.3s ease;
        }
        .social-icon:hover {
            transform: translateY(-5px) scale(1.1);
        }
        .btn-hover {
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #6c63ff, #ff6b6b);
            background-size: 200% auto;
        }
        .btn-hover:hover {
            background-position: right center;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .nav-link {
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(90deg, #6c63ff, #ff6b6b);
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .active::after {
            width: 100%;
        }

        /* New background effects */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(108, 99, 255, 0.1) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(255, 107, 107, 0.1) 0%, transparent 30%);
            z-index: -1;
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
            }
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(30, 30, 47, 0.9) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 30, 47, 0.9) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
        }

        .glow-effect {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.2) 0%, transparent 70%);
            filter: blur(30px);
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        .glow-effect:nth-child(1) {
            top: -100px;
            left: -100px;
        }

        .glow-effect:nth-child(2) {
            bottom: -100px;
            right: -100px;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.2) 0%, transparent 70%);
            animation-delay: 2s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body class="bg-[#1e1e2f] text-white min-h-screen overflow-x-hidden">
    <!-- Background elements -->
    <div class="grid-bg"></div>
    <div class="glow-effect"></div>
    <div class="glow-effect"></div>
    
    <div class="bg-particles" id="particles"></div>

    <!-- Header -->
    <header class="fixed w-full z-50 bg-[#1e1e2f]/90 backdrop-blur-md py-4 px-6 md:px-12 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-600 bg-clip-text text-transparent">
                CODEJOURNEY
            </a>
                    
            <nav class="flex items-center space-x-8">
                <!-- <a href="/" class="nav-link active text-lg font-medium">Home</a> -->
                <button class="btnLogin-popup px-6 py-2 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-medium hover:shadow-lg transition-all duration-300">
                    Login
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-48 pb-16 px-6 md:px-12">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-12">
            <!-- Left Content -->
            <div class="flex-1 space-y-8">
                <div class="space-y-4">
                    <h1 class="text-4xl md:text-6xl font-bold leading-tight">
                        CHÀO MỪNG ĐẾN VỚI <span class="bg-gradient-to-r from-purple-400 to-pink-600 bg-clip-text text-transparent">CODEJOURNEY</span>
                    </h1>
                    <h3 class="text-xl md:text-2xl text-gray-300">
                        Codejourney hân hạnh chào đón bạn, cùng tham gia nhé.
                    </h3>
                    <p class="text-gray-400 text-lg">
                        <!-- <i class='bx bx-map'></i> Hoa Hop - Nghi An - TP.Vinh - Nghe An - Viet Nam -->
                         <i class='bx bx-map-alt'></i> Nơi để bạn củng cố kiến thức lập trình
                    </p>
                </div>
                                
                <div class="flex flex-wrap gap-4">
                    <a href="https://www.facebook.com/dtnt2nghean/" target="_blank" class="btn-hover px-8 py-3 rounded-full text-white font-medium">
                        Learn More
                    </a>
                    <a href="/contact" class="px-8 py-3 rounded-full border-2 border-purple-500 text-white font-medium hover:bg-purple-500/10 transition-all duration-300">
                        Contact Us
                    </a>
                </div>
                                
                <div class="flex space-x-6 pt-4">
                    <a href="https://www.facebook.com/dtnt2nghean/" target="_blank" class="social-icon text-3xl text-purple-400 hover:text-purple-300">
                        <i class='bx bxl-facebook'></i>
                    </a>
                    <a href="https://www.facebook.com/profile.php?id=61571405943323" target="_blank" class="social-icon text-3xl text-blue-400 hover:text-blue-300">
                        <i class='bx bxl-blogger'></i>
                    </a>
                    <a href="#" class="social-icon text-3xl text-pink-400 hover:text-pink-300">
                        <i class='bx bxl-instagram-alt'></i>
                    </a>
                    <a href="https://www.youtube.com/@truongptdtntthptso2nghean269" target="_blank" class="social-icon text-3xl text-red-400 hover:text-red-300">
                        <i class='bx bxl-youtube'></i>
                    </a>
                </div>
                                
                <p class="text-gray-500 text-sm pt-8">
                    Web Design © by Ka Ka | All Rights Reserved.
                </p>
            </div>
                    
            <!-- Right Content - Logo -->
            <div class="flex-1 flex justify-center">
                <div class="glowing-circle">
                    <span></span>
                    <span></span>
                    <div class="image">
                        <img src="{{url_for('static', filename='styles/background/CodeJourney.png')}}" alt="School Logo">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginBtn = document.querySelector('.btnLogin-popup');
                    
            loginBtn.addEventListener('click', function () {
                window.location.href = '/login';
            });

            // Add active class to current nav link
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                if (link.href === window.location.href) {
                    link.classList.add('active');
                }
            });

            // Create particles for background
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size between 2px and 8px
                const size = Math.random() * 6 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Random animation duration
                const duration = Math.random() * 20 + 10;
                particle.style.animationDuration = `${duration}s`;
                
                // Random delay
                const delay = Math.random() * 10;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
            }
        });
    </script>
</body>
</html>
